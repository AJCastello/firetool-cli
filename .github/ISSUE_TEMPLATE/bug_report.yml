name: Bug report
description: Report a defect or regression in Firetool CLI
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please share enough detail to reproduce it locally against Firebase emulators.
  - type: input
    id: version
    attributes:
      label: Firetool CLI version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node.js version
      placeholder: 20.x
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command
      description: Exact command or script that triggered the problem
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Emulator context
      description: Relevant firebase.json, emulator hosts, or topology details
